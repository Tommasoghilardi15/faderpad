# Builds Faderpad.exe on Windows.
# - Every push and pull request: builds the .exe and keeps it as a downloadable artifact.
# - Pushing a tag like v1.0.0: also publishes a GitHub Release with the .exe attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check that it starts
        run: python -m faderpad --version

      - name: Build Faderpad.exe
        run: python -m PyInstaller --noconfirm --clean faderpad.spec

      - name: Check the .exe starts
        run: dist\Faderpad.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: Faderpad
          path: dist/Faderpad.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Faderpad.exe
          generate_release_notes: true
